# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Simplicial Rings
  description: >-
    Central polynomial simplices over arbitrary unital rings, their
    coefficient-natural polynomial retraction and explicit algebraic
    simplicial homotopy on the polynomial extension.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Prism
  license: Apache-2.0
sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - Charles A. Weibel
    type: book
    location: "Chapter IV, section 11 (mathematical motivation)"
    relationship: background
    note: >-
      Background for algebraic simplicial constructions; the library does
      not claim coverage of this chapter or borrow its Lean proof text.
automation:
  methods:
    - method: agent
      framework: "Formal Frontier agents using Lean 4"
      tool_setup: "AI-assisted proof development and static library transfer"
      prompting_notes: "Base and homotopy mathematics were authored separately; standalone packaging was not a new proof implementation."
review:
  status: self-assessed
  notes: >-
    Self-assessed describes this metadata assessment, not independent human
    review. The first release received independent agent review and
    revision-specific build and axiom checks; those checks do not certify
    later changes or complete coverage of the background source.
acknowledgements: >-
  Mathematical imports and native homotopy/whiskering infrastructure are
  supplied by mathlib. Original authorship, transfer and independent agent
  review roles are described in CONTRIBUTORS.md.
